[platformio]
build_dir = C:/Users/alison.tristao/.platformio/build_t_dongle
; native is a Unity test harness (see [env:native] below), not a buildable
; firmware target -- it has no src/ of its own and pulls in Arduino-only
; libs if a plain `pio run` tries to compile against it. Keep the default
; "build" action scoped to the firmware; run native tests explicitly via
; `pio test -e native` or the Test explorer.
default_envs = tdongle-s3

[env:tdongle-s3]
; ESP-IDF migration (see PLANO_ESPIDF_DONGLE.md), phase 0 onward. This used
; to be `framework = arduino` with USB-CDC monitor_speed as a cosmetic
; setting -- both gone now, see the comments below for what replaced them.
platform            = espressif32
board               = esp32-s3-devkitc-1
framework           = espidf
board_build.f_cpu   = 240000000L
board_build.flash_size    = 16MB
board_build.partitions    = partitions.csv

; monitor_speed is cosmetic again (decisao D4, REVISADA 2026-09-20): system
; logs (ESP_LOG, panic handler) go out USB-Serial/JTAG on the flashing COM
; port (CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG in sdkconfig.defaults), a
; different native USB controller from the CDC-ACM composite device phase 6
; brings up (esp_tinyusb, USB-OTG pin) -- CDC-ACM stays 100% dedicated to
; shell+BTP, logs/panics still need no external UART adapter.
monitor_speed       = 115200
upload_port         = COM5
monitor_port        = COM5
; Same reasoning as before the migration: decodes "Backtrace: 0x... 0x..."
; panic dumps into file:line using the ELF still in .pio/build.
monitor_filters     = esp32_exception_decoder

build_unflags =
    -std=gnu++11

; The channel/key contract has to hold for the firmware that SHIPS, not just
; for the host test run -- a dongle flashed from a drifted bally_channels.h
; talks to robots that disagree with it, which is exactly the silent failure
; the guard exists to prevent. All three scripts here are framework-agnostic
; (plain PlatformIO extra_scripts hooks), so they carry over unchanged.
extra_scripts =
    pre:scripts/check_channel_contract.py
    pre:scripts/check_espnow_tx_owner.py
    pre:scripts/inject_git_rev.py

build_flags =
    -std=gnu++2a
    -fexceptions
    ; bally_channels.h -- the single channel/ingress table -- lives in the
    ; project's own include/, which the firmware env already puts on the path.
    -I include
    ; 32, down from 64: g_rxQueue holds RxDatagramEvent (~260 B/slot), so 64
    ; was ~17 KB reserved at boot. 32 still absorbs a full fragment burst
    ; between espnow_rx worker ticks. Part of the boot-heap recovery in
    ; topicos/34 section 1B. Not consumed by anything yet in phase 0 -- kept
    ; here so EspNowManager does not need this flag re-added when phase 3
    ; brings it back into the build.
    -DRX_ASYNC_QUEUE_DEPTH=32
    ; Boot-loop instrumentation (topico 34/35): the "! after_* free_heap="
    ; lines, the "! reg:* largest=" lines and the 2s CDC-reenumerate hold.
    ; Keep ON while validating the boot on the bench; COMMENT OUT for a
    ; normal/field build so the boot is quiet and the handshake budget is
    ; not spent on the 2s hold. "last_reset=" stays on either way.
    -DDIAG_BOOT
    ; Semantic ANSI colour on shell output (TinyShell >= 1.2.0 ShellStyle):
    ; the BTP terminal (ShellOutput::renderResponse) wraps each line in an SGR
    ; sequence keyed to its class (error/warning/success/help/muted). TraceView
    ; maps those to its theme; a plain serial monitor renders them like any
    ; ANSI. Turning this ON requires a TraceView build that parses the subset
    ; (feature/terminal-ansi-colors) -- an older one prints "[31m" literally.
    -DTINYSHELL_COLOR
    ; Phase 6 (PLANO_ESPIDF_DONGLE.md secao 7, item 3): ConsoleCdc reboots to
    ; the ROM bootloader on a 1200-baud line-coding touch (esptool.py's
    ; classic reset sequence, no hardware auto-reset circuit on this board),
    ; the same trick arduino-esp32's USBCDC did internally before this
    ; migration. Opt-IN on purpose (opposite polarity of the old
    ; DONGLE_USB_NO_AUTORESET opt-out) -- keep ON while validating on the
    ; bench/reflashing often; a field build should not jump to the
    ; bootloader just because some host driver probes the line coding.
    -DDONGLE_USB_AUTORESET

; Arduino-only flags removed for good: ARDUINO_USB_MODE/ARDUINO_USB_CDC_ON_BOOT/
; ARDUINO_RUNNING_CORE (USB.h/TinyUSB config, reimplemented via esp_tinyusb in
; phase 6), BAUDRATE (USB-CDC never had a real one), DONGLE_USB_NO_AUTORESET
; (the 1200-baud-touch opt-out, reimplemented as a tud_cdc_line_coding_cb in
; phase 6). PSRAM note (topico 33: this chip has none) still applies --
; sdkconfig.defaults deliberately has no CONFIG_SPIRAM.

lib_deps =
    ; TinyShell carries ShellLineEditor (server-side line editor) and, since
    ; v1.2.0, ShellStyle (semantic ANSI colouring, gated by TINYSHELL_COLOR in
    ; build_flags above). Still a portable lib_deps entry under `framework =
    ; espidf` -- same as bally_OS -- because, unlike BTP, it has no native-only
    ; dependency (no mbedtls/PSA) that PlatformIO's LDF-built lib_deps graph
    ; would fail to wire up. Pinned to a tag for the same reason BTP is pinned
    ; below: this env ships, and the wire format has to match what bally_OS
    ; and TraceView were built against. [env:native] builds it from
    ; ../TinyShell to test the working tree.
    https://github.com/AlisonTristao/TinyShell.git#v1.4.1

; LovyanGFX (phase 7, decisao D1 -- lib/DonglePeripherals's DongleLcd,
; LcdDashboard, StartupConfig) is NOT a lib_deps entry either, for a sibling
; reason to BTP above: PlatformIO's LDF-driven builder applies this env's
; C++-only build_flags (-fuse-cxa-atexit) to LovyanGFX's .c sources too
; (glyph tables, image codecs) and GCC rejects that combination outright.
; Vendored as components/lovyangfx instead -- see that CMakeLists.txt for
; the full reasoning and what was trimmed out of the upstream tree.

; BTP is NOT here -- it is an ESP-IDF component (components/btp/), because a
; lib_deps library under `framework = espidf` is built outside the IDF CMake
; graph and never sees the mbedtls/PSA headers BTP/src/aead.cpp needs, so
; RadioSeal's btp::aead_* calls come out undefined at link time. See
; components/btp/CMakeLists.txt (mirrors bally_OS's). [env:native] still
; builds BTP from the sibling checkout via symlink://../BTP below.
;
; adafruit/Adafruit GFX + ST7735 are also NOT here -- both are Arduino-only.
; LCD comes back in phase 7 as LovyanGFX (decisao D1). SQLite (decisao D2)
; already came back in phase 5, as components/esp32-idf-sqlite3 (an
; ESP-IDF component, same reasoning as BTP above) -- not a lib_deps entry.

; Host-native env: runs ProtocolRouter/BtpTransport/DonglePublisher against
; BTP's canonical test vectors without ESP32 hardware (same pattern as
; bally_OS's [env:native]). No Arduino/FreeRTOS code is compiled here.
;
; BTP comes from the sibling checkout rather than the tag [env:tdongle-s3]
; pins, and deliberately: this env exists to test THIS working tree, so it
; should build against the protocol source sitting next to it rather than
; against whatever a remote already published. It also means the host suite
; keeps running while a BTP tag is still in flight, instead of every test
; erroring out on a clone that cannot resolve. The firmware env is the one
; that pins, and it is the pin that ships.
[env:native]
platform = native
test_framework = unity
test_build_src = no
test_filter =
    test_protocol_router
    test_serial_session
    test_clock_text
    test_subscription_registry
    test_dongle_publisher
    test_hub_relay
    test_dongle_key_store
    test_manifest_cache
    test_shell_output
extra_scripts =
    pre:scripts/native_static.py
    pre:scripts/check_user_text.py
    pre:scripts/check_channel_contract.py
    pre:scripts/check_espnow_tx_owner.py
lib_deps =
    symlink://../BTP
    ; ShellLineEditor (test_serial_session) -- same "test THIS working tree"
    ; reasoning as BTP above.
    symlink://../TinyShell
build_flags =
    -std=gnu++17
    ; bally_channels.h -- the single channel/ingress table -- lives in the
    ; project's own include/, which the firmware env already puts on the path.
    -I include
